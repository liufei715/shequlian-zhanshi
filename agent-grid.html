<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>治理智能体矩阵</title>
<style>
  :root{
    --bg-0:#050506;
    --cyan:#7fe9ff;
    --cyan-bright:#c9f8ff;
    --cyan-mid:#2fb2d9;
    --paper:#e7f3f7;
    --dim:#5f7382;
    --tile-scale:0.74;
    --tile-gap-mult:1.55;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:
      radial-gradient(ellipse 90% 75% at 28% 78%, #24262a 0%, #121316 40%, #050506 72%),
      #000;
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    color:var(--paper);
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 75% 65% at 35% 60%, #000 25%, transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 35% 60%, #000 25%, transparent 78%);
  }
  .corner-fade{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(228deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 22%, transparent 48%);
  }
  .ground-sheen{
    position:fixed; left:0; right:0; bottom:0; height:38%; z-index:1; pointer-events:none;
    background:linear-gradient(to top, rgba(120,140,155,.05), transparent);
  }
  .bokeh{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .bokeh span{ position:absolute; border-radius:50%; animation:drift linear infinite; will-change:transform; }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-22px) translateX(6px); }
    100%{ transform:translateY(0) translateX(0); }
  }

  .stage{
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .iso-grid{
    position:relative;
    transition:filter .4s ease;
    flex:none; /* the grid is deliberately larger than the viewport (see
      buildGrid); without this, flexbox's default shrink squashes #grid's
      own box down to the viewport width, which throws off centering for
      its absolutely-positioned tile children — most visible on narrow
      phone screens where the shrink is largest. */
  }

  .overlay{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:56px 20px 34px;
  }
  .heading{ text-align:center; opacity:0; animation:fadeUp .8s .1s ease forwards; }
  .heading .kicker{ font-size:11px; letter-spacing:.32em; color:var(--cyan); text-transform:uppercase; margin-bottom:10px; }
  .heading h1{ font-size:24px; font-weight:800; margin:0 0 6px; color:var(--paper); letter-spacing:-.005em; }
  .heading p{ font-size:12.5px; color:var(--dim); margin:0; letter-spacing:.02em; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .hint{ font-size:11px; color:#3d4a55; letter-spacing:.08em; opacity:0; animation:fadeUp .8s .6s ease forwards; }

  .footer-stack{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .footer-logo{
    display:flex; align-items:center; justify-content:center;
    opacity:0; animation:fadeUp .8s .7s ease forwards;
  }
  .footer-logo svg{ display:block; width:108px; height:auto; }

  .topbar{
    position:fixed; top:22px; right:22px; z-index:4; pointer-events:auto;
    opacity:0; animation:fadeUp .8s .15s ease forwards;
  }
  .logout-btn{
    display:flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    color:var(--paper); font-family:inherit; font-size:12px; font-weight:600; letter-spacing:.03em;
    padding:10px 18px 10px 16px; border-radius:999px; cursor:pointer;
    transition:background .25s ease, transform .2s ease, box-shadow .25s ease;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  }
  .logout-btn .glyph{ font-size:12px; opacity:.85; transform:translateY(-.5px); }
  .logout-btn:hover{
    background:rgba(255,255,255,.15); transform:translateY(-1px);
    box-shadow:0 14px 30px -12px rgba(0,0,0,.65), 0 0 20px -6px rgba(127,233,255,.35);
  }
  .logout-btn:active{ transform:translateY(0) scale(.97); }

  .tile{ position:absolute; cursor:pointer; }
  .tile-inner{
    position:relative; width:100%; height:100%;
    transition:transform .35s cubic-bezier(.2,.85,.25,1), filter .35s ease;
    filter:brightness(.5) saturate(.76) drop-shadow(0 10px 22px rgba(0,0,0,.55));
  }
  .tile img{
    position:absolute; inset:0; display:block; width:100%; height:100%;
    pointer-events:none; user-select:none;
  }
  .tile img.tile-img-hover{ opacity:0; transition:opacity .4s ease; }
  .tile.filler .tile-inner{ filter:brightness(.4) saturate(.72) drop-shadow(0 10px 22px rgba(0,0,0,.55)); }
  .tile.hot:hover .tile-inner, .tile.main:hover .tile-inner, .tile.active .tile-inner{
    transform:translateY(-8px) scale(1.045);
    filter:brightness(1.55) saturate(1.25) drop-shadow(0 0 32px rgba(127,233,255,.75)) drop-shadow(0 20px 30px rgba(0,0,0,.7));
  }
  /* the selected tile itself: crisp, near-instant response — no bounce,
     it's the thing driving the motion, not being dragged by it */
  .tile.active .tile-inner{
    transition:transform .3s cubic-bezier(.22,1,.36,1), filter .3s ease;
  }
  .tile.hot:hover img.tile-img-hover, .tile.main:hover img.tile-img-hover, .tile.active img.tile-img-hover{ opacity:1; }

  /* the company cube — the one tile that isn't a business-line agent.
     always at full brightness with a slow persistent pulse, so it reads
     as the hub the rest of the grid radiates from. */
  .tile.main .tile-inner{
    filter:brightness(1) saturate(1.15) drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(120,225,255,.4));
    animation:main-pulse 3.6s ease-in-out infinite;
  }
  @keyframes main-pulse{
    0%,100%{ filter:brightness(1) saturate(1.15) drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(120,225,255,.4)); }
    50%{ filter:brightness(1.14) saturate(1.28) drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(120,225,255,.7)); }
  }
  /* the running pulse animation otherwise keeps re-asserting its own filter
     every frame and masks the hover/select highlight — stop it explicitly
     whenever the tile is hovered or selected so the brighter state shows. */
  .tile.main:hover .tile-inner, .tile.main.active .tile-inner{
    animation:none;
    transform:translateY(-8px) scale(1.045);
    filter:brightness(1.65) saturate(1.35) drop-shadow(0 0 38px rgba(127,233,255,.85)) drop-shadow(0 20px 30px rgba(0,0,0,.7));
  }

  /* neighbors of the selected tile rise along with it, at half the height,
     so the pop reads as a ripple through the grid rather than an isolated
     cube. transition-delay is set per-tile from JS, scaled by distance from
     the active tile, and a springy overshoot easing gives the lift a
     "pulled taut" feel instead of popping up mechanically. shadow stays
     shallower than the active tile's to keep the depth hierarchy readable. */
  .tile.neighbor .tile-inner{
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), filter .4s ease;
    transform:translateY(-4px) scale(1.02);
    filter:brightness(.9) saturate(1) drop-shadow(0 8px 14px rgba(0,0,0,.4));
  }

  /* ---- idle ambience: breathing ground glow + drifting particles under every cube ---- */
  .tile-ground{
    position:absolute; left:50%; bottom:2%; width:64%; height:24%;
    transform:translate(-50%, 40%);
    border-radius:50%;
    background:radial-gradient(ellipse at center, var(--glow-c, rgba(127,233,255,.4)) 0%, transparent 72%);
    filter:blur(7px);
    pointer-events:none; mix-blend-mode:screen;
    animation:ground-breathe var(--bdur, 4.6s) ease-in-out infinite;
    animation-delay:var(--bdelay, 0s);
  }
  @keyframes ground-breathe{
    0%,100%{ opacity:.3; transform:translate(-50%,40%) scale(.88); }
    50%{ opacity:.8; transform:translate(-50%,40%) scale(1.12); }
  }
  .tile-ambient{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .ambient-particle{
    position:absolute; left:var(--ax,50%); bottom:var(--ay,4%);
    border-radius:50%;
    animation-name:ambient-drift;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    animation-duration:var(--adur, 5s);
    animation-delay:var(--adelay, 0s);
  }
  @keyframes ambient-drift{
    0%{ transform:translate(0,0) scale(.7); opacity:0; }
    18%{ opacity:var(--apeak,.75); }
    50%{ transform:translate(var(--dx,8px), var(--dy,-14px)) scale(1.15); }
    82%{ opacity:var(--apeak,.75); }
    100%{ transform:translate(var(--dx2,-6px), var(--dy2,-26px)) scale(.6); opacity:0; }
  }

  /* ---- flow lines: one persistent, unbroken glowing line per grid seam —
     no dashes, no dark gaps, no big sweeping blob. it's just a steady glow;
     the small .particle dots (see makeFlowParticle) carry the sense of
     motion. single element per edge, so this stays GPU-cheap regardless of
     particle count. depth-sorted via z-index. ---- */
  .flow-line{
    position:absolute; left:0; top:0; height:2px;
    transform-origin:0 50%; pointer-events:none;
    border-radius:2px;
    background:linear-gradient(90deg, #5fd6ff 0%, #bfe6f2 45%, #ff9e4a 100%);
    opacity:.6;
    box-shadow:0 0 7px 1px rgba(95,214,255,.6), 0 0 11px 2px rgba(255,158,74,.4);
    transition:opacity .3s ease, filter .3s ease, height .3s ease, margin-top .3s ease;
    filter:blur(.25px);
  }
  .flow-line.active{
    height:6px; margin-top:-2px;
    opacity:.95; filter:blur(.4px) brightness(1.4);
    box-shadow:0 0 18px 4px rgba(95,214,255,.75), 0 0 26px 6px rgba(255,158,74,.6);
  }

  /* sparse accent particles riding the same path — few per edge, the line
     already sells "continuous", these just add sparkle on top of it */
  .particle{
    position:absolute; left:0; top:0; border-radius:50%;
    offset-rotate:0deg;
    animation-name:particle-flow;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    will-change:offset-distance, opacity;
  }
  @keyframes particle-flow{
    0%{ offset-distance:0%; opacity:0; }
    10%{ opacity:var(--peak-op, 1); }
    90%{ opacity:var(--peak-op, 1); }
    100%{ offset-distance:100%; opacity:0; }
  }

  /* ---- mega modal: full "tech screen" panel that unfolds from a center
     seam outward to both sides when any tile is selected. replaces the old
     per-tile anchored tooltip — content is the same regardless of which
     tile triggered it (可信社区链 intro + full agent roster), with the
     selected agent highlighted in the list. ---- */
  .mega-modal{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    padding:6vh 20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .mega-modal.show{ opacity:1; pointer-events:auto; }
  .mega-backdrop{
    position:absolute; inset:0;
    background:transparent;
  }
  .mega-panel{
    position:relative; width:min(880px, 94vw); max-height:88vh;
    background:linear-gradient(155deg, rgba(255,255,255,.14) 0%, rgba(22,54,86,.5) 45%, rgba(4,9,17,.95) 100%);
    border:1px solid rgba(150,228,255,.36);
    border-radius:30px;
    backdrop-filter:blur(26px) saturate(160%);
    -webkit-backdrop-filter:blur(26px) saturate(160%);
    box-shadow:
      0 60px 120px -30px rgba(0,0,0,.8),
      0 0 70px -14px rgba(69,190,255,.4),
      inset 0 1px 0 rgba(255,255,255,.16);
    overflow:hidden;
    transform:scaleX(.015);
    transform-origin:50% 50%;
    transition:transform .6s cubic-bezier(.16,1,.3,1);
  }
  .mega-modal.show .mega-panel{ transform:scaleX(1); }
  .mega-scanline{
    position:absolute; left:0; right:0; top:50%; height:2px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, transparent 0%, #7fe9ff 18%, #fff 50%, #ff9e4a 82%, transparent 100%);
    box-shadow:0 0 22px 4px rgba(127,233,255,.65), 0 0 40px 8px rgba(255,158,74,.3);
    opacity:1; transition:opacity .3s ease .28s;
    pointer-events:none; z-index:2;
  }
  .mega-modal.show .mega-scanline{ opacity:0; }
  .mega-close{
    position:absolute; top:18px; right:18px; z-index:3;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--paper); font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, transform .2s ease;
  }
  .mega-close:hover{ background:rgba(255,255,255,.16); transform:rotate(90deg); }
  .mega-inner{
    position:relative; z-index:1;
    max-height:88vh; overflow-y:auto;
    padding:40px 44px 34px;
    opacity:0; transition:opacity .3s ease .32s;
  }
  .mega-modal.show .mega-inner{ opacity:1; }
  .mega-head{ text-align:center; margin-bottom:28px; }
  .mega-kicker{
    font-family:"SF Mono","Menlo",monospace; font-size:11px; letter-spacing:.32em;
    color:var(--cyan-bright); text-transform:uppercase; margin-bottom:12px;
    text-shadow:0 0 8px rgba(127,233,255,.5);
  }
  .mega-title{
    font-size:28px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px;
    color:#f4fdff; text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 16px rgba(120,225,255,.4);
  }
  .mega-sub{
    font-size:13px; line-height:1.75; color:var(--dim); margin:0 auto;
    max-width:520px;
  }

  /* ---- tab bar: switches between 基础产品 / 治理场景包 / 智能体 ---- */
  .mega-tabs{
    display:flex; justify-content:center; gap:8px;
    margin:22px 0 24px;
  }
  .mega-tab-btn{
    background:rgba(255,255,255,.05); border:1px solid rgba(150,228,255,.2);
    color:var(--dim); font-family:inherit; font-size:12.5px; font-weight:600;
    letter-spacing:.03em; padding:9px 20px; border-radius:999px; cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .mega-tab-btn.active{
    background:rgba(127,233,255,.14); border-color:rgba(150,228,255,.6);
    color:#f4fdff; box-shadow:0 0 20px -8px rgba(69,190,255,.6);
  }
  .mega-view{ display:none; }
  .mega-view.show{ display:block; }

  .mega-list{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
  }

  /* ---- shared card: name + detail on the left, a small animated icon on
     the right — used by all three tabs (智能体 / 基础产品 / 治理场景包) ---- */
  .mega-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    min-height:96px; padding:16px 18px; cursor:pointer; user-select:none;
    box-sizing:border-box;
  }
  .mega-card-body{ flex:1 1 auto; min-width:0; }
  .mega-card-title{
    font-size:13.5px; font-weight:700; color:#f4fdff; margin-bottom:4px; letter-spacing:.005em;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden;
  }
  .mega-card-desc{
    font-size:12px; line-height:1.55; color:#c3dae6;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  .mega-card-icon{
    flex:none; width:44px; height:44px; position:relative;
    display:flex; align-items:center; justify-content:center;
    animation:icon-live 4.6s ease-in-out infinite;
  }
  .mega-card-icon svg.mega-card-glyph{
    width:22px; height:22px; display:block; position:relative; z-index:2;
    transition:filter .3s ease; filter:brightness(1) saturate(1);
  }
  /* saturn-style rings, built as two half-arcs each (not a full ellipse):
     a crisp "near" half in front of the glyph, and a soft far half — faded
     out along a gradient toward its tip and gaussian-blurred — sitting
     behind the glyph. That gives real occlusion with the icon instead of a
     flat ring floating on top of it, plus a basic near/far perspective read.
     No fill or inset color, only the stroke line itself. */
  .mega-ring-svg{ position:absolute; top:50%; left:50%; pointer-events:none; overflow:visible; }
  .mega-ring-a{ width:62px; height:30px; margin:-15px 0 0 -31px; }
  .mega-ring-b{ width:56px; height:26px; margin:-13px 0 0 -28px; }
  .mega-ring-back{ z-index:1; }
  .mega-ring-front{ z-index:3; animation:ring-pulse 3.4s ease-in-out infinite; }
  .mega-ring-b.mega-ring-front{ animation-delay:-1.4s; }
  @keyframes ring-pulse{ 0%,100%{ opacity:.8; } 50%{ opacity:1; } }
  /* a single bright point riding ring A, tracing the same tilted ellipse
     so it visibly orbits the icon; dims and tucks behind on the far side. */
  .mega-card-icon::after{
    content:''; position:absolute; top:50%; left:50%;
    width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%;
    background:#eafcff; pointer-events:none;
    box-shadow:0 0 3px .5px rgba(154,238,255,.85), 0 0 1px #fff;
    animation:ring-orbit 4.5s linear infinite;
  }
  /* organic float + tilt + scale, not a mechanical spin — reads as "alive" */
  @keyframes icon-live{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    25%{ transform:translateY(-2.5px) rotate(5deg) scale(1.04); }
    50%{ transform:translateY(.5px) rotate(0deg) scale(1); }
    75%{ transform:translateY(2px) rotate(-5deg) scale(.97); }
    100%{ transform:translateY(0) rotate(0deg) scale(1); }
  }
  @keyframes ring-orbit{
    0%{ transform:translate(27.58px,-8.96px) scale(1.05); opacity:1; z-index:3; }
    4.167%{ transform:translate(27.68px,-5.46px) scale(1.05); opacity:1; z-index:3; }
    8.333%{ transform:translate(25.89px,-1.58px) scale(1.05); opacity:1; z-index:3; }
    12.5%{ transform:translate(22.34px,2.41px) scale(1.05); opacity:1; z-index:3; }
    16.667%{ transform:translate(17.27px,6.23px) scale(1.05); opacity:1; z-index:3; }
    20.833%{ transform:translate(11.02px,9.62px) scale(1.05); opacity:1; z-index:3; }
    25%{ transform:translate(4.02px,12.36px) scale(1.05); opacity:1; z-index:3; }
    29.167%{ transform:translate(-3.26px,14.26px) scale(1.05); opacity:1; z-index:3; }
    33.333%{ transform:translate(-10.31px,15.19px) scale(1.05); opacity:1; z-index:3; }
    37.5%{ transform:translate(-16.66px,15.08px) scale(1.05); opacity:1; z-index:3; }
    41.667%{ transform:translate(-21.88px,13.94px) scale(1.05); opacity:1; z-index:3; }
    45.833%{ transform:translate(-25.60px,11.86px) scale(1.05); opacity:1; z-index:3; }
    50%{ transform:translate(-27.58px,8.96px) scale(1.05); opacity:1; z-index:3; }
    54.167%{ transform:translate(-27.68px,5.46px) scale(0.72); opacity:0.4; z-index:1; }
    58.333%{ transform:translate(-25.89px,1.58px) scale(0.72); opacity:0.4; z-index:1; }
    62.5%{ transform:translate(-22.34px,-2.41px) scale(0.72); opacity:0.4; z-index:1; }
    66.667%{ transform:translate(-17.27px,-6.23px) scale(0.72); opacity:0.4; z-index:1; }
    70.833%{ transform:translate(-11.02px,-9.62px) scale(0.72); opacity:0.4; z-index:1; }
    75%{ transform:translate(-4.02px,-12.36px) scale(0.72); opacity:0.4; z-index:1; }
    79.167%{ transform:translate(3.26px,-14.26px) scale(0.72); opacity:0.4; z-index:1; }
    83.333%{ transform:translate(10.31px,-15.19px) scale(0.72); opacity:0.4; z-index:1; }
    87.5%{ transform:translate(16.66px,-15.08px) scale(0.72); opacity:0.4; z-index:1; }
    91.667%{ transform:translate(21.88px,-13.94px) scale(0.72); opacity:0.4; z-index:1; }
    95.833%{ transform:translate(25.60px,-11.86px) scale(0.72); opacity:0.4; z-index:1; }
    100%{ transform:translate(27.58px,-8.96px) scale(0.72); opacity:0.4; z-index:1; }
  }
  .mega-group:hover .mega-ring-front, .mega-item:hover .mega-ring-front{
    animation-play-state:paused;
    opacity:1;
    filter:brightness(1.3) drop-shadow(0 0 .8px rgba(255,255,255,.2));
  }
  .mega-group:hover .mega-card-icon svg.mega-card-glyph, .mega-item:hover .mega-card-icon svg.mega-card-glyph{
    filter:brightness(1.25) saturate(1.2);
  }

  /* ---- accordion groups: 基础产品 / 治理场景包 一级条目，可展开二级 ---- */
  .mega-groups{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; align-items:start; }
  .mega-group{
    position:relative; border-radius:20px; overflow:hidden;
    background:linear-gradient(155deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.025) 100%);
    border:1px solid rgba(150,228,255,.18);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:border-color .3s ease, background .3s ease, box-shadow .3s ease, transform .3s ease;
  }
  .mega-group:hover{
    border-color:rgba(150,228,255,.4);
    background:linear-gradient(155deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.04) 100%);

  // 10 abstract center motifs — dot / ring / cross / diamond / triangle /

  const CORE_MOTIFS = [

  // two saturn-style rings shared by every icon (geometry/color is fixed,

  // ---- tab switching between 基础产品 / 治理场景包 / 智能体 ----

  // multi-color palette: cool cyans + warm amber + violet accents for a
  // richer, more artistic tech feel than a single flat color.
  const PARTICLE_COLORS = ['#7fe9ff', '#c9f8ff', '#ffffff', '#5fd6ff', '#ffb066', '#c99bff'];
  // flow palette: interpolated tech-blue -> orange spectrum, so every
  // particle color comes from the same gradient the lines use instead of
  // being picked from unrelated hues.
  const FLOW_BLUE = [95, 214, 255], FLOW_ORANGE = [255, 158, 74];
  function lerpFlowColor(t){
    const r = Math.round(FLOW_BLUE[0] + (FLOW_ORANGE[0] - FLOW_BLUE[0]) * t);
    const g = Math.round(FLOW_BLUE[1] + (FLOW_ORANGE[1] - FLOW_BLUE[1]) * t);
    const b = Math.round(FLOW_BLUE[2] + (FLOW_ORANGE[2] - FLOW_BLUE[2]) * t);
    return `rgb(${r},${g},${b})`;
  }
  let flowEdges = [];          // built fresh each renderTiles call
  let activeFlowEdges = [];    // subset currently lit up by hover/click

  function makeFlowParticle(pathStr, dur, sizeMin, sizeMax){
    if (sizeMin == null) sizeMin = 0.8;
    if (sizeMax == null) sizeMax = 3.4;
    const p = document.createElement('div');
    p.className = 'particle';
    // cube the random factor so sizes skew small with occasional larger
    // sparks — a wider, less uniform spread than a flat random range.
    const size = sizeMin + Math.pow(Math.random(), 1.6) * (sizeMax - sizeMin);
    // continuous pick along the blue->orange gradient (not snapped to a
    // handful of buckets) so no two particles land on quite the same hue.
    const color = lerpFlowColor(Math.random());
    p.style.width = size.toFixed(2) + 'px';
    p.style.height = size.toFixed(2) + 'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 ${(size * 3.6).toFixed(1)}px ${color}, 0 0 ${(size * 1.4).toFixed(1)}px #fff`;
    p.style.setProperty('--peak-op', (0.72 + Math.random() * 0.28).toFixed(2));
    p.style.offsetPath = pathStr;
    p.style.animationDuration = dur.toFixed(2) + 's';
    p.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
    return p;
  }

  function clearFlowActive(){
    for (const e of activeFlowEdges) {
      e.line.classList.remove('active');
      e.line.style.setProperty('--flow-rev', e.idleRev);
      e.burst.forEach(el => el.remove());
      e.burst = [];
    }
    activeFlowEdges = [];
  }

  function markFlowActive(tile){
    clearFlowActive();
    const r = +tile.dataset.row, c = +tile.dataset.col;
    if (Number.isNaN(r) || Number.isNaN(c)) return;
    for (const e of flowEdges) {
      const d1 = Math.max(Math.abs(e.r1 - r), Math.abs(e.c1 - c));
      const d2 = Math.max(Math.abs(e.r2 - r), Math.abs(e.c2 - c));
      // only the up-to-4 edges that touch the selected tile itself —
      // not a wider radius of neighboring seams.
      if (Math.min(d1, d2) > 0) continue;

      // flow outward from the selected tile: whichever endpoint sits closer
      // to it is the "source", so particles/sweep travel from there toward
      // the far end, not the other way round.
      const outward = d1 <= d2 ? e.pathStr : e.pathStrRev;
      e.line.style.setProperty('--flow-rev', d1 <= d2 ? 'normal' : 'reverse');

      e.line.classList.add('active');
      e.burst = [];
      const extra = 10 + Math.floor(Math.random() * 5); // denser burst on the active link
      const dur = 0.5 + Math.random() * 0.5;
      const edgeLag = Math.min(d1, d2) * 0.08; // seams further out pop in a beat later
      for (let k = 0; k < extra; k++) {
        const p = makeFlowParticle(outward, dur, 1.4, 5.2);
        // positive delay so each particle visibly pops in at its own moment
        // instead of the whole burst fading in together — "错落" scatter
        p.style.animationDelay = (edgeLag + Math.random() * 0.55).toFixed(2) + 's';
        e.wrap.appendChild(p);
        e.burst.push(p);
      }
      activeFlowEdges.push(e);
    }
  }

  let neighborCleanupTimer = null;
  function clearNeighbors(){
    // keep each tile's stagger delay intact while it falls back — the chain
    // releases in the same order it pulled taut, center first, rim last —
    // then wipe the inline delay once every transition has had time to finish.
    const els = Array.from(grid.querySelectorAll('.tile.neighbor'));
    els.forEach(el => el.classList.remove('neighbor'));
    clearTimeout(neighborCleanupTimer);
    neighborCleanupTimer = setTimeout(() => {
      els.forEach(el => {
        const inner = el.querySelector('.tile-inner');
        if (inner) inner.style.transitionDelay = '';
      });
    }, 700);
  }

  function markNeighbors(tile){
    const r = +tile.dataset.row, c = +tile.dataset.col;
    if (Number.isNaN(r) || Number.isNaN(c)) return;
    const ax = +tile.dataset.cx, ay = +tile.dataset.cy;
    // only the 4 face-adjacent tiles (up/down/left/right) rise — no diagonals.
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (const [dr, dc] of dirs) {
      const nb = grid.querySelector(`.tile[data-row="${r + dr}"][data-col="${c + dc}"]`);
      if (!nb) continue;
      nb.classList.add('neighbor');
      // stagger by distance from the active tile, like slack running out
      // of a chain, so the lift visibly travels outward instead of
      // popping every neighbor at once
      const bx = +nb.dataset.cx, by = +nb.dataset.cy;
      const dist = Math.hypot(bx - ax, by - ay);
      const inner = nb.querySelector('.tile-inner');
      if (inner) inner.style.transitionDelay = Math.min(120, 60 + dist * 0.22).toFixed(0) + 'ms';
    }
  }

  function shuffledIndices(n){
    const arr = Array.from({length:n}, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getScale(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-scale')) || 0.6;
  }
  function getGapMult(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-gap-mult')) || 1.0;
  }

  // lay out `cols` x `rows` tiles in the diamond grid and return the
  // resulting bounding size; also fills `grid` with positioned .tile nodes.
  function renderTiles(cols, rows){
    const scale = getScale();
    const gapMult = getGapMult();
    const a = { x: A.x * scale * gapMult, y: A.y * scale * gapMult };
    const b = { x: B.x * scale * gapMult, y: B.y * scale * gapMult };
    const dispW = IMG_W * scale, dispH = IMG_H * scale;
    const tLocal = { x: T_PT.x * scale, y: T_PT.y * scale };

    const total = cols * rows;
    // every tile is interactive now; cycle through the agent list so each
    // cube still maps to one of the 10 real entries (repeating as needed).
    const order = shuffledIndices(DATA.length);
    // exactly one tile — the one nearest the grid's geometric center —
    // represents the company itself (主方块), everything else represents
    // one of its business-line agents.
    const mainR = Math.floor(rows / 2);
    const mainC = Math.floor(cols / 2) - 1; // one step up-left of dead-center (-column = up-left on screen)

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const tx = c * a.x + r * b.x;
        const ty = c * a.y + r * b.y;
        const left = tx - tLocal.x;
        const top = ty - tLocal.y;
        minX = Math.min(minX, left); maxX = Math.max(maxX, left + dispW);
        minY = Math.min(minY, top); maxY = Math.max(maxY, top + dispH);

        const isMain = r === mainR && c === mainC;
        const i = r * cols + c;
        const entry = isMain ? null : DATA[order[i % order.length]];
        cells.push({ r, c, left, top, isHot: !isMain, isMain, entry });
      }
    }

    const width = maxX - minX, height = maxY - minY;
    grid.style.width = width + 'px';
    grid.style.height = height + 'px';
    grid.innerHTML = '';

    const tileByKey = new Map();

    for (const cell of cells) {
      const tile = document.createElement('div');
      tile.className = 'tile ' + (cell.isMain ? 'main' : (cell.isHot ? 'hot' : 'filler'));
      tile.dataset.row = cell.r;
      tile.dataset.col = cell.c;
      const tx0 = cell.left - minX, ty0 = cell.top - minY;
      tile.style.left = tx0 + 'px';
      tile.style.top = ty0 + 'px';
      tile.style.width = dispW + 'px';
      tile.style.height = dispH + 'px';
      tile.style.zIndex = (cell.r + cell.c) * 2; // *2 leaves room for particle streams at the half-step between two tiles
      tile.dataset.cx = (tx0 + dispW / 2).toFixed(2);
      tile.dataset.cy = (ty0 + dispH * 0.34).toFixed(2);

      const inner = document.createElement('div');
      inner.className = 'tile-inner';

      const imgBase = document.createElement('img');
      imgBase.className = 'tile-img-base';
      imgBase.src = cell.isMain ? IMG_SRC_MAIN : IMG_SRC_BASE;
      imgBase.alt = '';
      imgBase.draggable = false;
      inner.appendChild(imgBase);

      const imgHover = document.createElement('img');
      imgHover.className = 'tile-img-hover';
      imgHover.src = cell.isMain ? IMG_SRC_MAIN : IMG_SRC_HOVER;
      imgHover.alt = '';
      imgHover.draggable = false;
      inner.appendChild(imgHover);

      // idle ambience: a soft breathing glow pooling at the base, plus a
      // few small particles drifting up around it — always on, randomized
      // per tile so the whole grid feels alive without being synchronized.
      const ground = document.createElement('div');
      ground.className = 'tile-ground';
      ground.style.setProperty('--glow-c', PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)] + '66');
      ground.style.setProperty('--bdur', (3.6 + Math.random() * 2.8).toFixed(2) + 's');
      ground.style.setProperty('--bdelay', (-Math.random() * 6).toFixed(2) + 's');
      tile.appendChild(ground);

      const ambient = document.createElement('div');
      ambient.className = 'tile-ambient';
      const ambientCount = 3 + Math.floor(Math.random() * 3);
      for (let k = 0; k < ambientCount; k++) {
        const ap = document.createElement('div');
        ap.className = 'ambient-particle';
        const size = 1 + Math.random() * 2.6;
        const color = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
        ap.style.width = size.toFixed(2) + 'px';
        ap.style.height = size.toFixed(2) + 'px';
        ap.style.background = color;
        ap.style.boxShadow = `0 0 ${(size * 2.6).toFixed(1)}px ${color}`;
        ap.style.setProperty('--ax', (30 + Math.random() * 40).toFixed(1) + '%');
        ap.style.setProperty('--ay', (-6 + Math.random() * 14).toFixed(1) + '%');
        ap.style.setProperty('--dx', (-10 + Math.random() * 20).toFixed(1) + 'px');
        ap.style.setProperty('--dy', (-(10 + Math.random() * 14)).toFixed(1) + 'px');
        ap.style.setProperty('--dx2', (-14 + Math.random() * 28).toFixed(1) + 'px');
        ap.style.setProperty('--dy2', (-(22 + Math.random() * 18)).toFixed(1) + 'px');
        ap.style.setProperty('--apeak', (0.45 + Math.random() * 0.45).toFixed(2));
        ap.style.setProperty('--adur', (3.5 + Math.random() * 3.5).toFixed(2) + 's');
        ap.style.setProperty('--adelay', (-Math.random() * 8).toFixed(2) + 's');
        ambient.appendChild(ap);
      }
      tile.appendChild(ambient);

      tile.appendChild(inner);

      if (cell.isHot) {
        const d = cell.entry;
        const dataIdx = String(DATA.indexOf(d) + 1).padStart(2, '0');
        tile.addEventListener('mouseenter', () => hoverTile(tile));
        tile.addEventListener('mouseleave', () => hoverEnd());
        tile.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeTile === tile && modalOpen) { closeModal(); return; }
          openModal(tile, d, dataIdx);
        });
      } else if (cell.isMain) {
        // the company cube: same modal, but no single agent gets highlighted
        tile.addEventListener('mouseenter', () => hoverTile(tile));
        tile.addEventListener('mouseleave', () => hoverEnd());
        tile.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeTile === tile && modalOpen) { closeModal(); return; }
          openModal(tile, null, null);
        });
      }
      grid.appendChild(tile);
      tileByKey.set(cell.r + ',' + cell.c, tile);
    }

    // flow lines: one persistent glowing dashed line per seam between
    // right/down neighbors, always running (see .flow-line / @keyframes
    // .flow-line). a handful of sparkle particles ride the same path for
    // texture. edge records are kept in `flowEdges` so hover can find
    // nearby seams and light them up (see markFlowActive / clearFlowActive).
    flowEdges = [];
    const beamDirs = [[0, 1], [1, 0]];
    for (const cell of cells) {
      const tileA = tileByKey.get(cell.r + ',' + cell.c);
      const ax = +tileA.dataset.cx, ay = +tileA.dataset.cy;
      const za = cell.r + cell.c;
      for (const [dr, dc] of beamDirs) {
        const tileB = tileByKey.get((cell.r + dr) + ',' + (cell.c + dc));
        if (!tileB) continue;
        const bx = +tileB.dataset.cx, by = +tileB.dataset.cy;
        const zb = (cell.r + dr) + (cell.c + dc);
        const z = za + zb;

        const t1 = 0.3, t2 = 0.7;
        const sx = ax + (bx - ax) * t1, sy = ay + (by - ay) * t1;
        const ex = ax + (bx - ax) * t2, ey = ay + (by - ay) * t2;
        const segDx = ex - sx, segDy = ey - sy;
        const segLen = Math.hypot(segDx, segDy) || 1;
        const angle = Math.atan2(segDy, segDx) * 180 / Math.PI;

        const wrap = document.createElement('div');
        wrap.className = 'flow-wrap';
        wrap.style.position = 'absolute';
        wrap.style.left = '0'; wrap.style.top = '0';
        wrap.style.zIndex = z;
        wrap.style.pointerEvents = 'none';

        const line = document.createElement('div');
        line.className = 'flow-line';
        line.style.left = sx.toFixed(1) + 'px';
        line.style.top = sy.toFixed(1) + 'px';
        line.style.width = segLen.toFixed(1) + 'px';
        line.style.transform = `rotate(${angle.toFixed(2)}deg)`;
        line.style.setProperty('--flow-dur', (2.2 + Math.random() * 1.4).toFixed(2) + 's');
        const idleRev = Math.random() < 0.5 ? 'normal' : 'reverse';
        line.style.setProperty('--flow-rev', idleRev);
        wrap.appendChild(line);

        const pathStr = `path('M${sx.toFixed(1)},${sy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}')`;
        const pathStrRev = `path('M${ex.toFixed(1)},${ey.toFixed(1)} L${sx.toFixed(1)},${sy.toFixed(1)}')`;
        const idleCount = 4 + Math.floor(Math.random() * 3);
        for (let k = 0; k < idleCount; k++) {
          wrap.appendChild(makeFlowParticle(pathStr, 3 + Math.random() * 1.8, 0.7, 2.6));
        }

        grid.appendChild(wrap);
        flowEdges.push({
          wrap, line, pathStr, pathStrRev, idleRev,
          r1: cell.r, c1: cell.c, r2: cell.r + dr, c2: cell.c + dc,
        });
      }
    }

    return { width, height };
  }

  function buildGrid(){
    const targetW = window.innerWidth * 1.15;
    const targetH = window.innerHeight * 1.15;
    let cols = 4, rows = 6;
    let size = { width: 0, height: 0 };
    for (let attempt = 0; attempt < 8; attempt++) {
      size = renderTiles(cols, rows);
      if (size.width >= targetW && size.height >= targetH) break;
      if (size.width < targetW) cols += 2;
      if (size.height < targetH) rows += 2;
    }
  }

  // ---- hover-only ambience: flow lines + neighbor ripple, no modal ----
  function hoverTile(tile){
    if (modalOpen) return;
    markFlowActive(tile);
    clearNeighbors();
    markNeighbors(tile);
  }
  function hoverEnd(){
    if (modalOpen) return;
    clearFlowActive();
    clearNeighbors();
  }

  // ---- mega modal: opens on click/select, unfolds from the center seam ----
  function openModal(tile, d, idx){
    clearTimeout(popupTimer);
    if (activeTile && activeTile !== tile) activeTile.classList.remove('active');
    tile.classList.add('active');
    activeTile = tile;
    modalOpen = true;
    markFlowActive(tile);
    clearNeighbors();
    markNeighbors(tile);

    megaList.querySelectorAll('.mega-item').forEach(el => {
      el.classList.toggle('active', el.dataset.idx === idx);
    });
    const activeItem = megaList.querySelector('.mega-item.active');

    // agent tiles land on the 智能体 tab with their entry highlighted;
    // the company cube (idx is null) opens on 基础产品 as a neutral overview.
    setMegaTab(idx ? 'agents' : 'products');

    megaModal.classList.add('show');
    if (activeItem) {
      requestAnimationFrame(() => {
        activeItem.scrollIntoView({ block:'nearest' });
      });
    }
  }

  function closeModal(){
    clearTimeout(popupTimer);
    megaModal.classList.remove('show');
    clearFlowActive();
    clearNeighbors();
    if (activeTile) activeTile.classList.remove('active');
    activeTile = null;
    modalOpen = false;
  }

  megaBackdrop.addEventListener('click', closeModal);
  megaClose.addEventListener('click', closeModal);
  megaPanel.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOpen) closeModal();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.tile') && !e.target.closest('.mega-panel')) closeModal();
  });

  buildGrid();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { closeModal(); buildGrid(); }, 250);
  });
</script>

</body>
</html>
